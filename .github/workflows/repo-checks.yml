name: repo-checks

on:
  workflow_call:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Verify codex-rs Cargo manifests inherit workspace settings
        run: python3 .github/scripts/verify_cargo_workspace_manifests.py

      - name: Verify codex-tui does not import codex-core directly
        run: python3 .github/scripts/verify_tui_core_boundary.py

      - name: Verify Bazel clippy flags match Cargo workspace lints
        run: python3 .github/scripts/verify_bazel_clippy_lints.py

      - name: Test Codex package builder
        run: python3 -m unittest discover -s scripts/codex_package -p 'test_*.py'

      - name: Test standalone installer
        run: python3 -m unittest discover -s scripts/install -p 'test_*.py'

      - name: Test macOS notarization
        run: python3 -m unittest discover -s .github/scripts/macos-signing -p 'test_notarize_with_akv.py'

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Native release artifacts are maintained by the canonical openai/codex
      # repository. Forks cannot rely on those artifacts because Actions
      # artifacts expire and are not reproduced by pull-request workflows.
      - name: Stage npm package
        if: github.repository == 'openai/codex'
        id: stage_npm_package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Select the newest successful rust-release run that publishes the
          # cross-platform native payload required by the npm package layout.
          # Derive the package version from its rust-v* release branch so the
          # workflow URL and staged tarball cannot drift apart or expire.
          release_workflow="$(gh run list \
            --repo openai/codex \
            --workflow .github/workflows/rust-release.yml \
            --status success \
            --limit 1 \
            --json headBranch,url \
            --jq 'first | [.headBranch, .url] | @tsv')"
          IFS=$'\t' read -r release_branch workflow_url <<< "${release_workflow}"
          if [[ -z "${release_branch}" || -z "${workflow_url}" || "${release_branch}" != rust-v* ]]; then
            echo "::error::Unable to resolve a successful openai/codex rust-release workflow." >&2
            exit 1
          fi
          CODEX_VERSION="${release_branch#rust-v}"
          WORKFLOW_URL="${workflow_url}"
          echo "Using ${WORKFLOW_URL} for Codex ${CODEX_VERSION} native artifacts."
          OUTPUT_DIR="${RUNNER_TEMP}"
          python3 ./scripts/stage_npm_packages.py \
            --release-version "$CODEX_VERSION" \
            --workflow-url "$WORKFLOW_URL" \
            --package codex \
            --output-dir "$OUTPUT_DIR"
          PACK_OUTPUT="${OUTPUT_DIR}/codex-npm-${CODEX_VERSION}.tgz"
          echo "pack_output=$PACK_OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Explain skipped native npm staging on forks
        if: github.repository != 'openai/codex'
        run: echo "Skipping native npm artifact staging because this is a fork; package-builder and installer tests still run above."

      - name: Upload staged npm package artifact
        if: github.repository == 'openai/codex'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-npm-staging
          path: ${{ steps.stage_npm_package.outputs.pack_output }}

      - name: Ensure root README.md contains only ASCII and certain Unicode code points
        run: ./scripts/asciicheck.py README.md
      - name: Check root README ToC
        run: python3 scripts/readme_toc.py README.md

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
      - name: Check formatting (run `just fmt` to fix)
        run: just fmt-check

      - name: Prettier (run `pnpm run format:fix` to fix)
        run: pnpm run format

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
