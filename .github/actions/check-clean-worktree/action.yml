name: check-clean-worktree
description: Fail when a CI job leaves tracked changes or untracked files in the repository worktree.

runs:
  using: composite
  steps:
    - name: Check for a clean worktree
      shell: bash
      run: |
        set -euo pipefail

        # Bazel 9 can materialize Windows-only module-extension state in the
        # committed lockfile after a build, even when the invocation requests
        # --lockfile_mode=off. Linux CI separately validates the committed
        # lockfile with --lockfile_mode=error; restore this generated Windows
        # state immediately before the generic worktree assertion.
        if [[ "${RUNNER_OS:-}" == "Windows" ]] && [[ -n "$(git -C "${GITHUB_WORKSPACE}" status --porcelain -- MODULE.bazel.lock)" ]]; then
          git -C "${GITHUB_WORKSPACE}" checkout -- MODULE.bazel.lock
        fi

        status="$(git -C "${GITHUB_WORKSPACE}" status --porcelain=v1 --untracked-files=normal --ignore-submodules=none)"
        if [[ -z "${status}" ]]; then
          exit 0
        fi

        echo "::error::CI job left tracked changes or untracked files in the repository worktree"
        printf '%s\n' "${status}"
        exit 1
